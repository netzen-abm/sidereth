name: Enforce Nine Active Branches

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# This workflow is deliberately read-only. Branch retirement is a reviewed
# governance operation: archive and verify the exact commit, inspect unique
# commits and dependencies, then delete only after explicit disposition.
# Never delete a branch automatically from a name allow-list.
permissions:
  contents: read
  pull-requests: read

jobs:
  audit-nine-active-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the canonical nine-branch inventory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            "main"
            "architecture/durable-tool-gateway-idempotency-v0-1-2026-09-19"
            "architecture/repo-organization-privacy-runtime-licensing-2026-09-17"
            "architecture/reticulum-inspired-cost-delay-sovereignty-research-2026-09-17"
            "governance/ruleset-baseline-2026-09-16"
            "docs/documentation-governance-2026-09-11"
            "docs/semantic-audit-domain-model-2026-09-11"
            "sidereth-ecosystem-architecture"
            "feat/knowledge-graph-next"
          )

          gh api --paginate -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/branches?per_page=100" --jq '.[].name' \
            | LC_ALL=C sort > /tmp/actual-branches.txt
          printf '%s\\n' "${expected[@]}" | LC_ALL=C sort > /tmp/expected-branches.txt

          actual_count=$(wc -l < /tmp/actual-branches.txt | tr -d ' ')
          if [[ "$actual_count" -ne 9 ]]; then
            echo "FAIL: expected exactly 9 active branches; found $actual_count."
            echo "No branches were changed. Review and disposition branches manually."
            cat /tmp/actual-branches.txt
            exit 1
          fi

          if ! diff -u /tmp/expected-branches.txt /tmp/actual-branches.txt; then
            echo "FAIL: active branch names differ from the canonical inventory."
            echo "No branches were changed. Archive, verify and review before retirement."
            exit 1
          fi

          echo "Active branch count: $actual_count"
          echo "Canonical nine-branch inventory: PASS"
          echo "Branch mutation: NONE (read-only audit)"
