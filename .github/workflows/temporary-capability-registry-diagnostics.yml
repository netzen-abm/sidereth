name: Temporary Capability Registry Diagnostics

on:
  push:
    branches:
      - sidereth-capability-registry-hardening-v2

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
      - name: Compile diagnostics
        run: |
          set +e
          cargo check --all-targets > /tmp/compile.out 2>&1
          status=$?
          cp /tmp/compile.out /tmp/compile-error.txt
          echo "cargo check exit status: $status" >> /tmp/compile-error.txt
          exit 0
      - name: Commit diagnostics
        run: |
          cp /tmp/compile-error.txt tmp-capability-registry-compile-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-capability-registry-compile-error.txt
          git commit -m "chore: record temporary registry compile diagnostics"
          git push