[package]
name = "sidereth-core"
version = "0.1.0"
edition = "2021"
description = "Privacy-first legal and regulatory workflow core for SIDERETH"
license = "MIT"

[features]
default = []
postgres = ["dep:postgres"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
postgres = { version = "0.19.14", optional = true, features = ["with-serde_json-1"] }
