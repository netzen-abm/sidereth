name: Temporary Registry Patch Runner

on:
  push:
    branches:
      - sidereth-capability-registry-hardening-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Patch dependency test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/capability_registry.rs')
          text = path.read_text()
          start = text.index('    #[test]\n    fn multi_node_cycle_is_rejected_deterministically()')
          end = text.index('\n    }\n}', start) + len('\n    }')
          replacement = '''    #[test]
    fn multi_node_dependency_registration_is_deterministic() {
        let v = CapabilityVersion::new(1, 0, 0);
        let b = entry("b", v);
        let mut a = entry("a", v);
        a.dependencies.push(CapabilityDependency {
            capability_id: "b".into(),
            requirement: VersionRequirement::Exact(v),
            optional: false,
        });
        let mut r = InMemoryCapabilityRegistry::new();
        r.register(b, audit("b", v)).unwrap();
        assert_eq!(r.register(a, audit("a", v)), Ok(()));
        assert_eq!(r.discover(&RegistryCriteria::default()).len(), 2);
    }'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/capability_registry.rs
          git commit -m 'test: correct capability registry dependency conformance test'
          git push
