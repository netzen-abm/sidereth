name: Temporary Capability Registry Diagnostics

on:
  push:
    branches:
      - sidereth-capability-registry-hardening-v2

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
      - name: Apply compile fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/capability_registry.rs")
          text = path.read_text()
          old = ".is_none_or(|v| entry.execution_modes.contains(v))"
          new = ".is_none_or(|v| entry.execution_modes.contains(&v))"
          if old not in text:
              raise SystemExit("expected target text not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify compile fix
        run: cargo check --all-targets
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capability_registry.rs
          git commit -m "fix: correct capability registry execution mode filter"
          git push
