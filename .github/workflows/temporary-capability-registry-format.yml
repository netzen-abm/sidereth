name: Temporary Capability Registry Format

on:
  push:
    branches:
      - sidereth-capability-registry-implementation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidereth-capability-registry-implementation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capability_registry.rs
          git commit -m "style: format capability registry"
          git push origin HEAD:sidereth-capability-registry-implementation
