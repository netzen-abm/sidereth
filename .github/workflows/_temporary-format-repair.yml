name: SIDERETH Temporary Format Repair

on:
  push:
    branches: [sidereth-p1-document-invariant]

permissions:
  contents: write

concurrency:
  group: sidereth-temporary-format-repair
  cancel-in-progress: true

jobs:
  format-repair:
    if: "!contains(github.event.head_commit.message, '[format-repair]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'SIDERETH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: apply rustfmt [format-repair]'
          gh auth setup-git
          git push origin HEAD:sidereth-p1-document-invariant
