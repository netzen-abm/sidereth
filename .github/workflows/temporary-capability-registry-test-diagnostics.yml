name: Temporary Capability Registry Test Diagnostics

on:
  push:
    branches:
      - sidereth-capability-registry-hardening-v2

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
      - name: Run tests
        run: |
          set +e
          cargo test --all-targets > /tmp/test.out 2>&1
          status=$?
          cp /tmp/test.out tmp-capability-registry-test-error.txt
          echo "cargo test exit status: $status" >> tmp-capability-registry-test-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-capability-registry-test-error.txt
          git commit -m "chore: record temporary registry test diagnostics"
          git push
          exit 0